name: Sync roadmap cache

on:
  schedule:
    # 09:20 UTC ≈ 5:20am ET, so the cache is fresh before the workday.
    - cron: "20 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-roadmap
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the roadmap sheet
        run: python3 scripts/sync-roadmap.py

      - name: Commit refreshed cache
        id: commit
        run: |
          # syncedAt changes every run, so only commit when an item actually moved.
          if git diff --quiet -- roadmap-q3.json; then
            echo "Roadmap unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$(git diff --unified=0 -- roadmap-q3.json | grep '^[+-] ' | grep -v '"syncedAt"')" ]; then
            echo "Only syncedAt changed; skipping commit."
            git checkout roadmap-q3.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roadmap-q3.json
          git commit -m "Sync roadmap cache for $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # A GITHUB_TOKEN push does not trigger pages.yml, so publish explicitly.
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
